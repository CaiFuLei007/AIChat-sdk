        /* ================================================================
           CHAT APP — 主聊天界面
           ================================================================ */
        function ChatApp({ user, onLogout }) {
            const toast = useToast();

            // App state
            const [models, setModels] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [currentSessionId, setCurrentSessionId] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [isStreaming, setIsStreaming] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [userScrolledUp, setUserScrolledUp] = useState(false);
            const [showModelModal, setShowModelModal] = useState(false);
            const [selectedModel, setSelectedModel] = useState('');

            // Refs
            const messagesEndRef = useRef(null);
            const messagesContainerRef = useRef(null);
            const inputRef = useRef(null);
            const streamCtrlRef = useRef(null);
            const autoScrollRef = useRef(true);

            // Derived
            const currentSession = useMemo(
                () => sessions.find(s => s.session_id === currentSessionId),
                [sessions, currentSessionId]
            );

            const hasMessages = messages.length > 0;

            // ============ DATA LOADING ============
            const loadModels = useCallback(async () => {
                try {
                    const res = await api.getModels();
                    if (res.code === 0) setModels(res.data.models || []);
                } catch (e) { /* silent */ }
            }, []);

            const loadSessions = useCallback(async () => {
                try {
                    const res = await api.getSessions(user.uid);
                    if (res.code === 0) setSessions(res.data.sessions || []);
                } catch (e) { /* silent */ }
            }, [user.uid]);

            const loadMessages = useCallback(async (ssid) => {
                try {
                    const res = await api.getMessages(ssid);
                    if (res.code === 0) setMessages(res.data.messages || []);
                } catch (e) {
                    toast('加载消息失败');
                }
            }, [toast]);

            // Initial load
            useEffect(() => {
                loadModels();
                loadSessions();
            }, [loadModels, loadSessions]);

            // ============ AUTO-SCROLL LOGIC ============
            const scrollToBottom = useCallback((force = false) => {
                if (!autoScrollRef.current && !force) return;
                const container = messagesContainerRef.current;
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, []);

            // When messages change during streaming, auto-scroll
            useEffect(() => {
                if (isStreaming) {
                    scrollToBottom();
                }
            }, [messages, isStreaming, scrollToBottom]);

            // Detect manual scroll
            const handleMessagesScroll = useCallback(() => {
                const container = messagesContainerRef.current;
                if (!container) return;

                const threshold = 80; // pixels from bottom
                const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < threshold;

                autoScrollRef.current = isAtBottom;
                setUserScrolledUp(!isAtBottom && isStreaming);
            }, [isStreaming]);

            // ============ SESSION MANAGEMENT ============
            const selectSession = useCallback(async (ssid) => {
                setCurrentSessionId(ssid);
                setMessages([]);
                setUserScrolledUp(false);
                autoScrollRef.current = true;
                await loadMessages(ssid);
                // Scroll to bottom after messages load
                setTimeout(() => scrollToBottom(true), 50);
            }, [loadMessages, scrollToBottom]);

            const createSession = useCallback(async (model) => {
                if (!model) {
                    toast('请先选择模型');
                    return;
                }

                try {
                    const res = await api.createSession(user.uid, model);
                    if (res.code !== 0) {
                        toast(res.msg || '创建失败');
                        return;
                    }
                    toast('会话已创建');
                    setShowModelModal(false);
                    setSelectedModel('');
                    await loadSessions();
                    await selectSession(res.data.session_id);
                } catch (e) {
                    toast('创建会话失败');
                }
            }, [user.uid, toast, loadSessions, selectSession]);

            const deleteSession = useCallback(async (ssid, e) => {
                e.stopPropagation();
                if (!confirm('确定要删除此会话吗？')) return;

                try {
                    const res = await api.removeSession(ssid);
                    if (res.code !== 0) {
                        toast(res.msg || '删除失败');
                        return;
                    }
                    toast('会话已删除');

                    if (currentSessionId === ssid) {
                        setCurrentSessionId(null);
                        setMessages([]);
                    }
                    await loadSessions();
                } catch (e) {
                    toast('删除会话失败');
                }
            }, [currentSessionId, toast, loadSessions]);

            // ============ MESSAGE SENDING ============
            const sendMessage = useCallback(async () => {
                const content = inputValue.trim();
                if (!content || !currentSessionId || isStreaming) return;

                // Clear input
                setInputValue('');
                if (inputRef.current) {
                    inputRef.current.style.height = 'auto';
                }

                // Add user message to display
                const userMsg = {
                    mid: 'temp-' + Date.now(),
                    role: 'user',
                    content,
                    create_time: new Date().toISOString(),
                };
                setMessages(prev => [...prev, userMsg]);

                // Start streaming
                setIsStreaming(true);
                setUserScrolledUp(false);
                autoScrollRef.current = true;

                // Create placeholder for assistant message
                const assistantMsg = {
                    mid: 'streaming-' + Date.now(),
                    role: 'assistant',
                    content: '',
                    create_time: new Date().toISOString(),
                    isStreaming: true,
                };
                setMessages(prev => [...prev, assistantMsg]);

                let fullContent = '';

                const stream = api.sendMessageStream(currentSessionId, content, {
                    onChunk(chunk) {
                        fullContent += chunk;
                        setMessages(prev => prev.map(m =>
                            m.mid === assistantMsg.mid
                                ? { ...m, content: fullContent }
                                : m
                        ));
                    },
                    onDone() {
                        setIsStreaming(false);
                        setMessages(prev => prev.map(m =>
                            m.mid === assistantMsg.mid
                                ? { ...m, isStreaming: false }
                                : m
                        ));
                        streamCtrlRef.current = null;
                        // Refresh sessions to update last_message
                        loadSessions();
                    },
                    onError(err) {
                        setIsStreaming(false);
                        setMessages(prev => prev.map(m =>
                            m.mid === assistantMsg.mid
                                ? { ...m, content: fullContent || '发送失败: ' + err.message, isStreaming: false, isError: true }
                                : m
                        ));
                        streamCtrlRef.current = null;
                        toast('消息发送失败');
                    },
                });

                streamCtrlRef.current = stream;
            }, [inputValue, currentSessionId, isStreaming, toast, loadSessions]);

            // ============ INPUT HANDLERS ============
            const handleInputChange = useCallback((e) => {
                setInputValue(e.target.value);
                // Auto-resize
                const el = e.target;
                el.style.height = 'auto';
                el.style.height = Math.min(el.scrollHeight, 160) + 'px';
            }, []);

            const handleKeyDown = useCallback((e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            }, [sendMessage]);

            // ============ LOGOUT ============
            const handleLogout = useCallback(() => {
                if (streamCtrlRef.current) {
                    streamCtrlRef.current.abort();
                }
                onLogout();
            }, [onLogout]);

            // ============ BACK TO BOTTOM ============
            const handleBackToBottom = useCallback(() => {
                autoScrollRef.current = true;
                setUserScrolledUp(false);
                scrollToBottom(true);
            }, [scrollToBottom]);

            return (
                <div id="app-page">
                    {/* ======== SIDEBAR ======== */}
                    <div className={`sidebar ${sidebarOpen ? '' : 'collapsed'}`}>
                        <div className="sidebar-header">
                            <div className="sidebar-brand">
                                <span className="brand-star">✦</span> AIChat
                            </div>
                            <button className="btn-new-session" onClick={() => setShowModelModal(true)}>
                                + 新建会话
                            </button>
                        </div>

                        <div className="session-list" id="session-list">
                            {sessions.length === 0 ? (
                                <div className="session-list-empty">
                                    暂无会话<br/>
                                    点击上方按钮创建新会话
                                </div>
                            ) : (
                                sessions.map(s => (
                                    <div
                                        key={s.session_id}
                                        className={`session-item ${s.session_id === currentSessionId ? 'active' : ''}`}
                                        onClick={() => selectSession(s.session_id)}
                                    >
                                        <div className="session-item-model">{escapeHtml(s.model_name)}</div>
                                        <div className="session-item-preview">
                                            {escapeHtml(s.last_message || '新会话')}
                                        </div>
                                        <div className="session-item-time">{formatTime(s.update_time || s.create_time)}</div>
                                        <button
                                            className="session-delete"
                                            onClick={(e) => deleteSession(s.session_id, e)}
                                            title="删除会话"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="sidebar-footer">
                            <div className="sidebar-user">
                                <div className="sidebar-user-avatar">
                                    {user.email.charAt(0).toUpperCase()}
                                </div>
                                <span className="sidebar-user-email" title={user.email}>
                                    {user.email}
                                </span>
                            </div>
                            <button className="btn-logout" onClick={handleLogout}>
                                退出
                            </button>
                        </div>
                    </div>

                    {/* ======== CHAT AREA ======== */}
                    <div className="chat-area">
                        {/* Sidebar toggle */}
                        <button
                            className="sidebar-toggle"
                            onClick={() => setSidebarOpen(!sidebarOpen)}
                            title={sidebarOpen ? '收起侧边栏' : '展开侧边栏'}
                        >
                            {sidebarOpen ? '◁' : '▷'}
                        </button>

                        {/* Back to bottom FAB */}
                        <button
                            className={`back-to-bottom ${userScrolledUp ? 'visible' : ''}`}
                            onClick={handleBackToBottom}
                            title="回到最新"
                        >
                            ↓
                        </button>

                        {!currentSessionId ? (
                            /* Empty state */
                            <div className="empty-state">
                                <div className="empty-illustration">
                                    <div className="empty-circle">
                                        <span className="empty-star">✦</span>
                                    </div>
                                </div>
                                <div className="empty-title">开始新的对话</div>
                                <div className="empty-hint">
                                    在左侧选择模型并创建会话<br/>
                                    或选择已有会话继续对话
                                </div>
                            </div>
                        ) : (
                            /* Chat view */
                            <>
                                <div className="chat-header">
                                    <span className="chat-header-model">
                                        {currentSession?.model_name || 'Chat'}
                                    </span>
                                    <span className="chat-header-id">
                                        #{currentSessionId.slice(0, 8)}
                                    </span>
                                </div>

                                <div
                                    className="messages-container"
                                    ref={messagesContainerRef}
                                    onScroll={handleMessagesScroll}
                                >
                                    {messages.map(msg => (
                                        <MessageBubble key={msg.mid} message={msg} />
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>

                                <div className="input-area">
                                    <div className="input-wrapper">
                                        <textarea
                                            ref={inputRef}
                                            className="msg-input"
                                            value={inputValue}
                                            onChange={handleInputChange}
                                            onKeyDown={handleKeyDown}
                                            placeholder={isStreaming ? 'AI 正在回复中...' : '输入消息... (Enter 发送, Shift+Enter 换行)'}
                                            rows={1}
                                            disabled={isStreaming}
                                        />
                                        <button
                                            className="btn-send"
                                            onClick={sendMessage}
                                            disabled={isStreaming || !inputValue.trim()}
                                            title="发送 (Enter)"
                                        >
                                            ➤
                                        </button>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    {/* ======== MODEL SELECTION MODAL ======== */}
                    {showModelModal && (
                        <div className="modal-overlay" onClick={() => { setShowModelModal(false); setSelectedModel(''); }}>
                            <div className="modal-card" onClick={e => e.stopPropagation()}>
                                <div className="modal-title">选择模型</div>
                                <div className="modal-subtitle">为新会话选择一个大模型</div>

                                <div className="model-option-list">
                                    {models.length === 0 ? (
                                        <div style={{ textAlign: 'center', color: 'var(--ink-muted)', padding: 'var(--space-6)' }}>
                                            暂无可用模型
                                        </div>
                                    ) : (
                                        models.map(m => (
                                            <button
                                                key={m.model_name}
                                                className={`model-option ${selectedModel === m.model_name ? 'selected' : ''}`}
                                                onClick={() => setSelectedModel(m.model_name)}
                                            >
                                                <div className="model-option-radio"></div>
                                                <div className="model-option-info">
                                                    <div className="model-option-name">{m.model_name}</div>
                                                    <div className="model-option-desc">{m.model_desc || '暂无描述'}</div>
                                                </div>
                                            </button>
                                        ))
                                    )}
                                </div>

                                <div className="modal-actions">
                                    <button
                                        className="btn-cancel"
                                        onClick={() => { setShowModelModal(false); setSelectedModel(''); }}
                                    >
                                        取消
                                    </button>
                                    <button
                                        className="btn-confirm"
                                        disabled={!selectedModel}
                                        onClick={() => createSession(selectedModel)}
                                    >
                                        创建会话
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ================================================================
           MESSAGE BUBBLE COMPONENT
           ================================================================ */
        function MessageBubble({ message }) {
            const isUser = message.role === 'user';
            const avatar = isUser ? 'U' : 'AI';

            const contentHtml = useMemo(() => {
                if (isUser) return null; // User messages rendered as plain text
                return renderMarkdown(message.content);
            }, [message.content, isUser]);

            return (
                <div className={`message ${isUser ? 'user' : 'assistant'}`}>
                    <div className="message-avatar">{avatar}</div>
                    <div className="message-bubble">
                        {isUser ? (
                            message.content
                        ) : (
                            <div
                                className="msg-content"
                                dangerouslySetInnerHTML={{ __html: contentHtml }}
                            />
                        )}
                        {message.isStreaming && (
                            <span className="typing-cursor"></span>
                        )}
                        {message.isError && (
                            <span style={{ color: 'var(--error)', fontSize: '0.8rem' }}> ⚠</span>
                        )}
                    </div>
                </div>
            );
        }

        /* ================================================================
           APP ROOT
           ================================================================ */
        function App() {
            const [user, setUser] = useState(null);

            const handleLogin = useCallback((userData) => {
                setUser(userData);
            }, []);

            const handleLogout = useCallback(() => {
                setUser(null);
            }, []);

            return (
                <ToastProvider>
                    {user ? (
                        <ChatApp user={user} onLogout={handleLogout} />
                    ) : (
                        <AuthPage onLogin={handleLogin} />
                    )}
                </ToastProvider>
            );
        }

        /* ================================================================
           MOUNT
           ================================================================ */
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
